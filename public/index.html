<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NativeCopy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand" id="brandLogo">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
        <span class="brand-title">NativeCopy</span>
      </div>

      <div class="header-right">
        <!-- Live Status -->
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-label" id="statusText">Sync On</span>
        </div>

        <!-- Auth / User Header Area -->
        <div id="headerAuthArea"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">

    <!-- Logged-in Dashboard View -->
    <section id="appView" class="hidden">
      
      <!-- Quick Paste / Create Bar -->
      <div class="action-bar">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Cari snippet..." autocomplete="off">
        </div>
        <button id="btnNewSnippet" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Snippet Baru</span>
        </button>
      </div>

      <!-- Categories Filter -->
      <div class="filter-scroll" id="filterTabs">
        <button class="filter-chip active" data-filter="all">Semua (<span id="countAll">0</span>)</button>
        <button class="filter-chip" data-filter="pinned">📌 Pinned (<span id="countPinned">0</span>)</button>
        <button class="filter-chip" data-filter="plaintext">Text</button>
        <button class="filter-chip" data-filter="javascript">JS / TS</button>
        <button class="filter-chip" data-filter="python">Python</button>
        <button class="filter-chip" data-filter="bash">Bash / Shell</button>
        <button class="filter-chip" data-filter="sql">SQL</button>
        <button class="filter-chip" data-filter="json">JSON</button>
      </div>

      <!-- Snippets Feed -->
      <div id="snippetsGrid" class="snippets-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="9"></line>
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="11" y2="17"></line>
          </svg>
        </div>
        <h3>Belum Ada Snippet</h3>
        <p>Salin teks atau kode di laptop/HP ini, maka akan langsung muncul di perangkat lain yang login akun sama.</p>
        <button id="btnEmptyNew" class="btn btn-secondary">+ Tambah Snippet Pertama</button>
      </div>

    </section>

    <!-- Auth View (When Logged Out) -->
    <section id="authView" class="auth-section">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Masuk ke NativeCopy</h2>
          <p>Gunakan akun yang sama di Laptop, PC Lab, atau HP agar clipboard otomatis tersinkronisasi.</p>
        </div>

        <div class="auth-tabs">
          <button id="tabLogin" class="tab-btn active">Masuk (Login)</button>
          <button id="tabRegister" class="tab-btn">Daftar Akun</button>
        </div>

        <form id="authForm" class="auth-form">
          <div class="form-group">
            <label for="authUsername">Username</label>
            <input type="text" id="authUsername" required placeholder="Contoh: devlab" autocomplete="username">
          </div>

          <div class="form-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" required placeholder="••••••••" autocomplete="current-password">
          </div>

          <div id="authError" class="auth-error hidden"></div>

          <button type="submit" id="btnSubmitAuth" class="btn btn-primary btn-block">
            <span id="authBtnText">Masuk (Login)</span>
          </button>
        </form>
      </div>
    </section>

  </main>

  <!-- Modal: Create / Edit Snippet -->
  <div id="modalSnippet" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Snippet Baru</h3>
        <button id="btnCloseSnippetModal" class="icon-btn" aria-label="Tutup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="snippetForm" class="modal-form">
        <input type="hidden" id="editSnippetId" value="">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="snippetTitleInput">Judul (Opsional)</label>
            <input type="text" id="snippetTitleInput" placeholder="Contoh: Query SQL, Token API, Command Build">
          </div>
          <div class="form-group flex-1">
            <label for="snippetLangInput">Format</label>
            <select id="snippetLangInput">
              <option value="plaintext">Plain Text</option>
              <option value="javascript">JavaScript / TS</option>
              <option value="python">Python</option>
              <option value="bash">Bash / Shell</option>
              <option value="sql">SQL</option>
              <option value="json">JSON</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="snippetContentInput">Teks / Kode</label>
          <textarea id="snippetContentInput" required rows="8" placeholder="Paste teks atau kode di sini..."></textarea>
        </div>

        <div class="form-group-checkbox">
          <label>
            <input type="checkbox" id="snippetPinInput">
            <span>📌 Sematkan di paling atas (Pin)</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnCancelSnippet" class="btn btn-secondary">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSaveSnippet">Simpan & Sync</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
